name: Build iOS Framework

# Triggers:
#   develop  → Preview build: uploads Simulator + Device frameworks
#   main     → Stable build:  uploads Simulator + Device frameworks
#   feature/* PRs → Validation only (must pass before merging to develop)
#
# NOTE: This builds and validates the KMP shared framework for iOS.
# For actual device distribution, use TestFlight with the Device framework artifact.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create .env from example
        run: cp -n .env.example .env || touch .env

      - name: Build KMP shared iOS framework — Simulator (iosSimulatorArm64)
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Build KMP shared iOS framework — Device (iosArm64)
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      # develop → Preview frameworks
      - name: Upload Preview iOS Simulator Framework (develop)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Simulator-Framework-Preview
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
          retention-days: 14

      - name: Upload Preview iOS Device Framework (develop)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Device-Framework-Preview
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 14

      # main → Stable release frameworks
      - name: Upload Stable iOS Simulator Framework (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Simulator-Framework-Stable
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
          retention-days: 90

      - name: Upload Stable iOS Device Framework (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Device-Framework-Stable
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 90
