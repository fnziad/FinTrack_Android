name: iOS Framework Build

on:
  push:
    branches: [ main, feature/ios-kmp ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build KMP shared iOS framework (Simulator & Arm64)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload Shared Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-framework
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
