name: Build Android APK

on:
  push:
    branches: [ "main", "master", "feature/ios-kmp" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  # Pin JDK 21 explicitly — macOS runners default to system JDK 26 which
  # breaks the Android SDK 36 jlink/jmod transform step.
  JAVA_HOME: ${{ steps.setup-java.outputs.path }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      id: setup-java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Create .env from example
      run: cp -n .env.example .env || touch .env

    - name: Generate Debug Keystore if missing
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TakaKoi-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
